
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>My Business</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      background: #f0f4ff;
    }

    header {
      background: #1749a5;
      color: white;
      padding: 25px;
    }

    section {
      padding: 35px 15px;
    }

    button {
      background: #1749a5;
      color: white;
      padding: 12px 22px;
      border: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Business</h1>
    <p>Welcome to our website!</p>
  </header>

  <section>
    <h2>Our Services</h2>
    <p>We provide quality services to our customers.</p>

    <button onclick="showMessage()">
      Contact Us
    </button>
  </section>

  <script>
    function showMessage() {
      alert("Thank you for contacting us!");
    }
  </script>
</body>
</html>
